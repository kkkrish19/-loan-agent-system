version: '3.8'

services:
  neo4j:
    image: neo4j:5.12.0-community
    container_name: loan-graph-db
    ports:
      - "7474:7474" # Neo4j Browser Dashboard
      - "7687:7687" # Bolt connection port
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
